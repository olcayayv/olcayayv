name: Metrics
on:
  schedule: [{cron: "0 0 * * *"}]
  workflow_dispatch:
  push: {branches: ["master", "main"]}

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config_timezone: Europe/Istanbul
          
          # Görseldeki gibi karanlık temayı zorlar
          theme: dark
          
          # 1. TEMEL BİLGİLER & SATIR İSTATİSTİKLERİ (Sol Sütun)
          base: header, activity, community, repositories, metadata
          plugin_lines: yes
          plugin_lines_history_limit: 1
          plugin_lines_repositories_limit: 4
          plugin_lines_sections: base
          
          # 2. KODLAMA ALIŞKANLIKLARI VE SAAT GRAFİKLERİ (Orta Sütun)
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          
          # 3. KULLANILAN DİLLER BARI (Sağ Alt / Orta)
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage, lines
          plugin_languages_indepth: yes
          plugin_languages_limit: 8
          
          # 4. TEKNOLOJİ İKONLARI VE KONULAR (Sol Alt İkonlar)
          plugin_topics: yes
          plugin_topics_limit: 15
          plugin_topics_mode: icons
          
          # 5. 3D İZOMETRİK TAKVİM (Sağ Üst)
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
