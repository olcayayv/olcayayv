<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 150" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .mono{font-family:ui-monospace,'SF Mono','Cascadia Code',Consolas,'DejaVu Sans Mono',monospace}
    .line{stroke-dasharray:1100;stroke-dashoffset:1100;animation:draw 2s ease forwards}
    @keyframes draw{to{stroke-dashoffset:0}}
    .blink{animation:b 1.2s steps(1) infinite}
    @keyframes b{50%{opacity:0}}
  </style>
  <rect width="1200" height="150" rx="18" fill="#050505"/>
  <line class="line" x1="50" y1="40" x2="1150" y2="40" stroke="#1F2328" stroke-width="1"/>
  <g class="mono" text-anchor="middle" letter-spacing="5">
    <text x="600" y="84" font-size="13" fill="#5A6068">THANKS FOR VISITING</text>
    <text class="blink" x="600" y="114" font-size="15" fill="#FFFFFF" letter-spacing="7">▶ CONTINUE? <tspan fill="#C6FF3D">Y</tspan> / N</text>
  </g>
  <rect x=".5" y=".5" width="1199" height="149" rx="18" fill="none" stroke="#1F2328"/>
</svg>
