<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420">
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#FFFFFF" opacity=".07"/>
    </pattern>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset=".5" stop-color="#FFFFFF" stop-opacity=".07"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="vig" cx=".5" cy=".5" r=".75">
      <stop offset=".55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".85"/>
    </radialGradient>
    <clipPath id="frame"><rect x="0" y="0" width="1200" height="420" rx="18"/></clipPath>
  </defs>
  <style>
    .mono{font-family:ui-monospace,'SF Mono','Cascadia Code',Consolas,'DejaVu Sans Mono',monospace}
    .sans{font-family:'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif}
    .swoosh{animation:drift 14s ease-in-out infinite alternate}
    .swoosh2{animation:drift 18s ease-in-out infinite alternate-reverse}
    @keyframes drift{from{transform:translate(0,0)}to{transform:translate(-60px,20px)}}
    .scan{animation:scan 5s linear infinite}
    @keyframes scan{from{transform:translateY(-140px)}to{transform:translateY(560px)}}
    .title{opacity:0;animation:rise 1s cubic-bezier(.2,.8,.2,1) .3s forwards}
    @keyframes rise{from{opacity:0;transform:translateY(18px);letter-spacing:40px}to{opacity:1;transform:translateY(0)}}
    .g1{animation:g1 4s steps(1) infinite}
    .g2{animation:g2 4s steps(1) infinite}
    @keyframes g1{0%,92%,100%{opacity:0;transform:translate(0,0)}93%{opacity:.7;transform:translate(-6px,2px)}95%{opacity:.6;transform:translate(5px,-2px)}97%{opacity:.5;transform:translate(-3px,0)}}
    @keyframes g2{0%,92%,100%{opacity:0;transform:translate(0,0)}93%{opacity:.5;transform:translate(6px,-1px)}96%{opacity:.6;transform:translate(-5px,2px)}}
    .sub{opacity:0;animation:fade .8s ease 1.2s forwards}
    .hud{opacity:0;animation:fade .6s ease .1s forwards}
    @keyframes fade{to{opacity:1}}
    .blink{animation:blink 1.1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
    .bar{transform-origin:0 0;transform:scaleX(0);animation:load 2.6s cubic-bezier(.6,0,.2,1) 1.4s forwards}
    @keyframes load{to{transform:scaleX(1)}}
    .loading{animation:hide .1s linear 4s forwards}
    @keyframes hide{to{opacity:0}}
    .start{opacity:0;animation:show .1s linear 4.05s forwards,blink 1.1s steps(1) 4.1s infinite}
    @keyframes show{to{opacity:1}}
  </style>

  <g clip-path="url(#frame)">
    <rect width="1200" height="420" fill="#050505"/>
    <rect width="1200" height="420" fill="url(#dots)"/>

    <!-- PP-inspired swooshes -->
    <g class="swoosh" opacity=".09">
      <path d="M760 -40 C 900 120, 980 260, 1080 470 L 1150 470 C 1060 250, 980 110, 840 -40 Z" fill="#FFFFFF"/>
    </g>
    <g class="swoosh2" opacity=".06">
      <path d="M120 470 C 160 330, 260 220, 420 160 L 430 190 C 290 250, 210 350, 190 470 Z" fill="#FFFFFF"/>
      <rect x="880" y="120" width="300" height="10" fill="#FFFFFF"/>
    </g>

    <rect class="scan" x="0" y="0" width="1200" height="140" fill="url(#scan)"/>
    <rect width="1200" height="420" fill="url(#vig)"/>

    <!-- HUD corners -->
    <g class="hud" stroke="#FFFFFF" stroke-width="2" fill="none" opacity=".9">
      <path d="M36 70 V36 H70"/><path d="M1130 36 H1164 V70"/>
      <path d="M36 350 V384 H70"/><path d="M1164 350 V384 H1130"/>
    </g>
    <g class="hud mono" font-size="13" letter-spacing="2">
      <text x="88" y="58" fill="#8B949E">PLAYER_01 <tspan fill="#3A3F45">//</tspan> <tspan fill="#FFFFFF">OLCAYAYV</tspan></text>
      <g transform="translate(1092 58)" text-anchor="end">
        <text fill="#8B949E">STATUS <tspan fill="#FFFFFF">ONLINE</tspan></text>
      </g>
      <circle class="blink" cx="1108" cy="53" r="5" fill="#C6FF3D"/>
    </g>

    <!-- Title with glitch -->
    <g text-anchor="middle" class="sans" font-weight="900" font-size="104" letter-spacing="10">
      <g class="title">
        <text class="g1" x="600" y="222" fill="#8B949E">OLCAY AYVA</text>
        <text class="g2" x="600" y="222" fill="#3A3F45">OLCAY AYVA</text>
        <text x="600" y="222" fill="#FFFFFF">OLCAY AYVA</text>
      </g>
    </g>

    <g class="sub mono" text-anchor="middle" font-size="16" letter-spacing="6">
      <text x="600" y="272" fill="#8B949E">GAME DEVELOPER <tspan fill="#C6FF3D">/</tspan> SOFTWARE DEVELOPER</text>
    </g>

    <!-- Loading -> Press start -->
    <g class="mono" font-size="12" letter-spacing="3" text-anchor="middle">
      <g class="loading">
        <rect x="450" y="318" width="300" height="3" fill="#1A1D21"/>
        <rect class="bar" x="450" y="318" width="300" height="3" fill="#FFFFFF"/>
        <text x="600" y="346" fill="#5A6068">LOADING WORLD...</text>
      </g>
      <text class="start" x="600" y="330" fill="#FFFFFF" font-size="14" letter-spacing="6">▶ PRESS START</text>
    </g>
  </g>
  <rect x=".5" y=".5" width="1199" height="419" rx="18" fill="none" stroke="#1F2328"/>
</svg>
